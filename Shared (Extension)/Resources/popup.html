<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By Bye Tabs</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <div class="header">
            <div class="logo">
                <img src="Group 1.png" alt="By Bye Tabs" class="logo-image">
            </div>
        </div>

        <div class="main-content">

            <div class="settings-section">
                <h3>Settings</h3>
                
                <div class="setting-item toggle-setting">
                    <span class="setting-label">Enable Celebrations 🎉</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="animationsToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>

            </div>

            <div class="stats-section">
                <h3>Statistics</h3>
                <div class="stat-item">
                    <span class="stat-label">Tabs closed today:</span>
                    <span class="stat-value" id="tabsClosedToday">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Total tabs closed:</span>
                    <span class="stat-value" id="totalTabsClosed">0</span>
                </div>
            </div>

            <div class="actions-section">
                <button id="resetStatsBtn" class="action-btn secondary">Reset Statistics</button>
            </div>

            <div class="supported-apps">
                <h3>Supported Apps</h3>
                <div class="app-list">
                    <div class="app-item">Zoom</div>
                    <div class="app-item">Figma</div>
                    <div class="app-item">Slack</div>
                    <div class="app-item">Teams</div>
                    <div class="app-item">Discord</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="version">v1.0.0</div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
